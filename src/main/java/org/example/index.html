<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Management</title>
    <!-- Stylesheet CSS links -->
    <link rel="stylesheet" href="style.css">
    <!-- Links to Bootstrap assets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Select2 assets -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Real Estate Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Estates</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </div>
</nav>

<!-- Filtering -->
<div class="px-4 py-4">
    <div id="filtering-box" class="d-flex align-items-center justify-content-between">
        <select class="form-select select2" id="location" style="width: 250px;">
            <option value="" disabled selected style="text-align: center;">Select a Location</option>
            <option value="Frankfurt am Main">Frankfurt am Main</option>
            <option value="Eschborn">Eschborn</option>
            <option value="Aschaffenburg">Aschaffenburg</option>
        </select>

        <select class="form-select select2" id="Property-type" style="width: 250px;">
            <option value="" disabled selected style="text-align: center;">Select a Property Type</option>
            <option value="Apartment">Apartment</option>
            <option value="House">House</option>
            <option value="Student-Apartment">Student Apartment</option>
            <option value="Share Apartment">Share Apartment</option>
        </select>

        <select class="form-select select2" id="Buy-Rent" style="width: 250px;">
            <option value="" disabled selected style="text-align: center;">Select Buy/Rent</option>
            <option value="Buy">Buy</option>
            <option value="Rent">Rent</option>
        </select>

        <select class="form-select select2" id="Rooms" style="width: 250px;">
            <option value="" disabled selected style="text-align: center;">Select Rooms</option>
            <option value="1">1 Room</option>
            <option value="2">2 Rooms</option>
            <option value="3">3 Rooms</option>
            <option value="4">4 Rooms</option>
            <option value="5">5 Rooms</option>
        </select>

        <select class="form-select select2" id="Budget" style="width: 250px;">
            <option value="" disabled selected style="text-align: center;">Budget</option>
            <option value="0-500">0 - 500</option>
            <option value="501-1000">501 - 1000</option>
            <option value="1001-1500">1001 - 1500</option>
            <option value="1501-2000">1501 -2000</option>
            <option value="2001-2500">2001 -2500</option>
            <option value="2501-3000">2501 -3000</option>
            <option value="3001-3500">3001 -3500</option>
            <option value="3501-4000">3501 -4000</option>
        </select>

        <!-- Button -->
        <button type="button" class="btn btn-primary" name="Search" id="searchButton">Search</button>
    </div>

    <!-- Cards -->
    <div class="mt-4" id="cards">
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Southend</h5>
                <h6 class="card-subtitle mb-2 text-body-secondary">Frankfurt am Main (Apartment, Rent)</h6>
                <div class="row-card-properties">
                    <div class="col-sm-4">
                        <p class="card-text">$2800</p>
                    </div>
                    <div class="col-sm-4">
                        <p class="card-text">80m²</p>
                    </div>
                    <div class="col-sm-4">
                        <p class="card-text">2 Rooms</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Westend</h5>
                <h6 class="card-subtitle mb-2 text-body-secondary">Eschborn (Share Apartment, Rent)</h6>
                <div class="row-card-properties">
                    <div class="col-sm-4">
                        <p class="card-text">$2600</p>
                    </div>
                    <div class="col-sm-4">
                        <p class="card-text">50m²</p>
                    </div>
                    <div class="col-sm-4">
                        <p class="card-text">2 Rooms</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Northend</h5>
                <h6 class="card-subtitle mb-2 text-body-secondary">Aschaffenburg (House, Buy)</h6>
                <div class="row-card-properties">
                    <div class="col-sm-4">
                        <p class="card-text">$4800</p>
                    </div>
                    <div class="col-sm-4">
                        <p class="card-text">180m²</p>
                    </div>
                    <div class="col-sm-4">
                        <p class="card-text">4 Rooms</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- JavaScript Script -->
<script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script defer src="script.js"></script>
<!-- Links to Bootstrap assets -->
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<!-- Select2 assets -->
<script defer src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

</body>
</html>
